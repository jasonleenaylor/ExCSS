name: build-test

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    timeout-minutes: 15
    permissions:
      contents: read
    # Windows is required to run the net462 tests.
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    # A release is a tag named v<Version>, where <Version> is the value in ExCSS.csproj.
    - name: Check that the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        version=$(dotnet msbuild ExCSS/ExCSS.csproj -getProperty:Version)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "Tag $GITHUB_REF_NAME does not match package version $version"
          exit 1
        fi

    - name: Build
      run: dotnet build ExCSS.sln -c Release

    - name: Test
      run: dotnet test ExCSS.sln -c Release --no-build

    - name: Pack
      run: dotnet pack ExCSS/ExCSS.csproj -c Release --no-build --output ./artifacts

    - name: Upload NuGet package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: NuGet package
        path: ./artifacts/*.nupkg

    # The token behind this organization secret must cover the SIL.ExCSS package.
    - name: Publish NuGet package
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push artifacts/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.SILLSDEV_PUBLISH_NUGET_ORG }} --skip-duplicate
